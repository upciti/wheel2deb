name: 🚀 CI/CD

on:
  push:

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Load Cached Poetry
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: poetry-dependencies-v2

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: Load Cached Python Dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: python-dependencies-${{ hashFiles('**/poetry.lock') }}

      - name: Install Python Dependencies
        run: poetry install

      - name: Install APT Dependencies
        uses: upciti/wakemeops-action@v1
        with:
          packages: |
            build-essential
            debhelper
            fakeroot

      - name: Run ruff format
        run: poetry run ruff format

      - name: Run ruff check
        run: poetry run ruff check

      - name: Run pytest
        run: poetry run pytest --cov=src --cov-report=term-missing tests

      - name: Generate coverage report
        shell: bash
        run: poetry run coverage xml

      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml

      - name: Build single binary application
        run: |
          poetry install --extras pyinstaller
          poetry run poetry-dynamic-versioning
          poetry run pyinstaller --onefile src/wheel2deb/__main__.py --name wheel2deb -s
          dist/wheel2deb version
          dist/wheel2deb
          mv dist/wheel2deb wheel2deb_linux_amd64

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel2deb_linux_amd64
          path: wheel2deb_linux_amd64
          retention-days: 2

  publish_release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test_and_build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install clog-cli
        uses: upciti/wakemeops-action@v1
        with:
          packages: clog-cli

      - name: Build Release Changelog
        run: |
          clog --setversion $(git tag --sort=creatordate | tail -n1) \
               --from $(git tag --sort=creatordate | tail -n2 | head -n1) \
               -o changelog.md \
               -r https://github.com/upciti/wheel2deb

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: wheel2deb_linux_amd64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: changelog.md
          files: wheel2deb_linux_amd64

  publish_pypi:
    runs-on: ubuntu-latest
    needs: [test_and_build]
    if: startsWith(github.ref, 'refs/tags')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Load Cached Poetry
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: poetry-dependencies-v2

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Get Release Version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Build Distribution
        run: |
          poetry version "$RELEASE_VERSION"
          poetry build

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish_image:
    runs-on: ubuntu-latest
    needs: [test_and_build]
    if: github.event.repository.fork == false && startsWith(github.ref, 'refs/tags')
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set docker image tags and labels
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.repository.fork == false && startsWith(github.ref, 'refs/tags') && github.ref_name || '' }}

      - name: Check Docker image
        run: docker run --rm ghcr.io/${{ github.repository }}:${{ github.ref_name }} --help
